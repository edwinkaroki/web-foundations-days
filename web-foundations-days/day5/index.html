
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 5 - User Directory</title>
    <script src="users.js" defer></script>
</head>
<body>
    <header>
        <h1>User Directory</h1>
        <p>Fetch and filter users from an API.</p>
    </header>

    <main>
        <button id="load-users" type="button">Load Users</button>

        <label for="filter-input">Filter users by name:</label>
        <input
            type="text"
            id="filter-input"
            placeholder="Search users..."
        >

        <p id="status" role="status">Click Load Users to begin.</p>

        <ul id="users-list"></ul>
    </main>
</body>
</html>
